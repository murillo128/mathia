<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Two convex sets separated by an affine line</title>
  <desc id="desc">Two disjoint shaded convex regions lie on opposite sides of a diagonal separating line with a normal arrow.</desc>
  <rect width="640" height="360" fill="#fbfaf6"/>
  <path d="M85 238 Q105 115 245 112 Q300 160 245 245 Q150 290 85 238 Z" fill="#8fd3ff" stroke="#135b96" stroke-width="4"/>
  <path d="M395 105 Q515 70 565 175 Q548 268 420 263 Q350 205 395 105 Z" fill="#ffc18c" stroke="#a33b20" stroke-width="4"/>
  <path d="M303 35 L347 325" stroke="#202124" stroke-width="6"/>
  <path d="M326 180 L405 168" stroke="#202124" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="270" y="55" font-family="sans-serif" font-size="20">separating hyperplane</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#202124"/></marker></defs>
</svg>
