<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Two planes forced to share a line</title>
  <desc id="desc">Two translucent planes in a three-dimensional schematic overlap along a dark line labeled intersection.</desc>
  <rect width="640" height="360" fill="#fbfaf6"/>
  <polygon points="90,250 330,85 555,155 315,320" fill="#58a6ff" fill-opacity="0.42" stroke="#135b96" stroke-width="4"/>
  <polygon points="115,120 500,80 525,265 140,305" fill="#ff8a65" fill-opacity="0.38" stroke="#a33b20" stroke-width="4"/>
  <path d="M173 243 L461 119" stroke="#202124" stroke-width="8"/>
  <text x="405" y="230" font-family="sans-serif" font-size="22" fill="#202124">U ∩ W</text>
  <text x="130" y="92" font-family="sans-serif" font-size="24" fill="#a33b20">U</text>
  <text x="525" y="300" font-family="sans-serif" font-size="24" fill="#135b96">W</text>
</svg>
