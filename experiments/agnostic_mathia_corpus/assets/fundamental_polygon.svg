<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Boundary identifications on a fundamental polygon</title>
  <desc id="desc">A rectangle whose opposite horizontal edges share one arrow label and whose opposite vertical edges share another, indicating paired gluing.</desc>
  <rect width="640" height="360" fill="#fbfaf6"/>
  <path d="M155 80 H485 V280 H155 Z" fill="#d9ecff" stroke="#18324a" stroke-width="5"/>
  <path d="M230 80 H410" stroke="#b3261e" stroke-width="8" marker-end="url(#arrow-red)"/>
  <path d="M410 280 H230" stroke="#b3261e" stroke-width="8" marker-end="url(#arrow-red)"/>
  <path d="M155 225 V130" stroke="#116329" stroke-width="8" marker-end="url(#arrow-green)"/>
  <path d="M485 130 V225" stroke="#116329" stroke-width="8" marker-end="url(#arrow-green)"/>
  <text x="320" y="62" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#b3261e">a</text>
  <text x="320" y="322" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#b3261e">a</text>
  <text x="125" y="188" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#116329">b</text>
  <text x="515" y="188" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#116329">b</text>
  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#b3261e"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#116329"/></marker>
  </defs>
</svg>
