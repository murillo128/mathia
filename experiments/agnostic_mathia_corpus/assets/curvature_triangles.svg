<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Geodesic triangles in negative, zero, and positive curvature</title>
  <desc id="desc">Three schematic triangles compare inward-bowed, straight, and outward-bowed geodesic sides; labels indicate angle sum below, equal to, or above the flat reference.</desc>
  <rect width="900" height="360" fill="#fbfaf6"/>
  <g transform="translate(30 35)">
    <path d="M40 235 Q145 110 250 235 Q145 190 40 235 M40 235 Q95 80 145 45 Q195 80 250 235" fill="none" stroke="#5b3f95" stroke-width="6"/>
    <text x="145" y="285" text-anchor="middle" font-family="sans-serif" font-size="22">negative: sum &lt; flat</text>
  </g>
  <g transform="translate(315 35)">
    <path d="M40 235 L145 45 L250 235 Z" fill="none" stroke="#245b78" stroke-width="6"/>
    <text x="145" y="285" text-anchor="middle" font-family="sans-serif" font-size="22">zero: sum = flat</text>
  </g>
  <g transform="translate(600 35)">
    <path d="M40 235 Q145 285 250 235 Q300 120 145 45 Q-10 120 40 235" fill="none" stroke="#9b4d12" stroke-width="6"/>
    <text x="145" y="285" text-anchor="middle" font-family="sans-serif" font-size="22">positive: sum &gt; flat</text>
  </g>
</svg>
