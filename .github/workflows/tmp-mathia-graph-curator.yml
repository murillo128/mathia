# Frontier fertility telemetry

This is **derived strategic telemetry, not mathematical evidence**. Atlas territory mass measures the map; frontier episodes measure marginal research outcomes. Raw finding counts are deliberately not used and these ratios never feed Research Watch.

The canonical event set is [[research/graph/atlas/telemetry/frontier-events.jsonl|frontier-events.jsonl]]. The file retains the fixed trailing global window of **20 classifiable prospective episodes** recommended by the curator procedure. Older episodes remain recoverable from Git history rather than being preserved as a run diary. Entries whose exact `source_paths` no longer resolve are not retained.

## Newest classifiable source window

The newest source window `{BASE}` → `{SOURCE_HEAD}` contributes thirteen episodes:

{chr(10).join(table)}

Analytic Frontier, Prime Flute and Robin Extremal remain the three viable extensions. Analytic Frontier converts all-interval prime uniformity into a super-polylogarithmic endpoint-migration bill; Prime Flute weakens its surviving endpoint theorem to low-output leakage after spatial propagation; Robin Extremal converts the same selected CA coordinate into an opposite-sign standard prime-race cone with coupled event depth.

Prime Circle is the sole known-prior-art collision in this window: the natural noncommuting coordinate/refinement carrier is the classical Cuntz `ax+b`/Bost–Connes architecture, with finite synchronized nonlinearities still collapsing to character data. The other nine lines record source-backed barriers: cheap output fidelity without cheap source access, sparse-source saturation, nonlinear correlation bills, target-poor low-energy closure, programmable boundary selectors, unavailable support-edge multi-window calibration, count–depth screening, mixed-prime sign programmability and noncoercive Xi-tail specificity.

