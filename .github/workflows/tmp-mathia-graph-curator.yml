# Cuntz ax+b semigroup C*-algebra over the natural numbers

## What it is

Cuntz's arithmetic C*-algebra is generated by the addition/dilation semigroup over the natural numbers. Its defining unitary/isometry relations extend the Bost–Connes algebra by the additive generator, and its stabilization has an affine crossed-product description over the finite adeles.

## Relation to RH / Mathia research

[[research/prime_circle/findings/PC-241-original-coordinate-refinement-noncommutativity-is-the-classical-cuntz-ax-b-system|PC-241]] identifies the canonical Prime-Circle coordinate together with all-scale power-map pullbacks with exactly these addition–dilation relations. This classicalizes the abstract noncommutative refinement carrier; any surviving Prime-Circle mechanism must use geometric/source data not fixed by the `ax+b` algebra itself.

## Known scope and limits

The classicalization concerns the operator algebra generated by coordinate, refinement pullbacks and their range projections. It does not exclude additional source-forced unbounded operators, primitive-shell geometry, off-circle fields, or other data outside those affine relations.

## Related prior art

- [[research/prior_art/bost-connes-system|Bost–Connes system]].

## Evidence and provenance

- Joachim Cuntz, *C*-algebras associated with the `ax+b`-semigroup over N*, in *K-Theory and Noncommutative Geometry* (2008), 201–215. DOI `10.4171/060-1/8`; arXiv:math/0611541.
- Authoritative Mathia source anchor: [[research/prime_circle/SOURCES#Affine semigroup C*-algebras]].
- Triggering persisted finding: [[research/prime_circle/findings/PC-241-original-coordinate-refinement-noncommutativity-is-the-classical-cuntz-ax-b-system]].
