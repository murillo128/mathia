t leakage into a sublinear output window is dangerous, and exponential separation reduces that window to logarithmic size. The route remains viable with a much narrower, directly testable low-output leakage criterion for the actual Robin/reflection conversion.\n\n**Prime Lattice** accumulates classical automorphic positivity but ends at a selector obstruction. Artin/Rankin–Selberg and Maaß–Selberg structure can supply positive pieces, yet designed pseudolaplacian boundary conditions and boundary-triple Weyl functions remain programmable enough to place spectral data unless arithmetic input selects the domain first. Boundary self-adjointness or positivity by itself is therefore not source-forced RH evidence.\n\n**Robin Extremal** materially strengthens its source-selected false-RH geometry. The same threshold-tangent colossally-abundant event coordinate now controls adjacent prime-power depth and forces, at the same real parameters, a negative Chebyshev error at the defect scale together with a positive logarithmic Mertens-product error at the complementary scale. This converts the earlier sparse-host picture into a concrete opposite-sign standard prime-race cone and leaves a sharper arithmetic incompatibility target.\n\n**Visual Exploration** keeps the support-edge carrier but loses the easy multi-window calibration. Moment cancellation and collision removal isolate the genuine higher factorial channel, while the restricted-support Rudnick–Sarnak regime cannot simultaneously resolve two edge windows at the needed scale. A rigorous `1/L` chronology interpretation therefore still needs direct zeta cross-height mixing, wider-support four-level input, or a rederived statistic rather than another CUE control subtraction.\n\n**Weil Inertia** turns finite-frequency screening into a count–depth tariff. Fixed reciprocal-harmonic packets can be neutralized by sufficiently deep off-line pairs, and gaining localization by radial depth spends source mass rather than creating it.