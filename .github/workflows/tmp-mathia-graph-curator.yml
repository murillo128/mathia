# All-interval short-interval nilsequence uniformity for von Mangoldt

## What it is

The all-interval theorem of Matomäki, Shao, Tao and Teräväinen gives a uniform short-interval discorrelation statement for the von Mangoldt function after subtraction of its structured approximant, including fixed-complexity nilsequence/polynomial phases in the range used by the current Analytic Frontier source model.

## Relation to RH / Mathia research

[[research/analytic_frontier/findings/ANF-164-all-interval-discorrelation-repels-endpoint-energy-past-the-cubic-scale-below-epsilon-one-sixteenth|ANF-164]] imports this theorem to replace an almost-all interval input by an all-interval source bound. [[research/analytic_frontier/findings/ANF-165-fixed-cramer-granville-gauge-forces-super-polylogarithmic-endpoint-energy-migration|ANF-165]] then uses the resulting source control to force endpoint-completion energy beyond every fixed polylogarithmic multiple of the cubic onset under a fixed Cramér–Granville gauge.

## Known scope and limits

This is a source-side uniformity theorem, not an RH criterion. In Mathia it sharpens the endpoint bill but does not prove that the remaining source-heavy completion is impossible or that it creates the final coercivity needed for RH.

## Related prior art

The same `SOURCES.md` section records the companion almost-all-interval theorem used earlier in the Analytic Frontier chain.

## Evidence and provenance

- Kaisa Matomäki, Xuancheng Shao, Terence Tao and Joni Teräväinen, *Higher uniformity of arithmetic functions in short intervals I. All intervals*, Forum of Mathematics, Pi 11 (2023), e29. DOI `10.1017/fmp.2023.28`; arXiv:2204.03754.
- Authoritative Mathia source anchor: [[research/analytic_frontier/SOURCES#Short-interval major arcs and Dirichlet-polynomial mean values]].
- Triggering persisted finding: [[research/analytic_frontier/findings/ANF-164-all-interval-discorrelation-repels-endpoint-energy-past-the-cubic-scale-below-epsilon-one-sixteenth]].
''', encoding='utf-8')

