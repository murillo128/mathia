name: One-off graph topology candidate
on:
  push:
    branches: [codex/graph-topology-audit-2b61065]
    paths: [.github/workflows/graph-topology-audit-once.yml]
permissions:
  contents: write
jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Preserve helper outside publication tree and pin current main
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/graph-topology-once.py "$RUNNER_TEMP/graph-topology-once.py"
          git fetch --no-tags --depth=1 origin main
          parent=$(git rev-parse FETCH_HEAD)
          git fetch --no-tags --depth=1 origin 2b610652fd76598b46be1d065f4798a20275dfba
          git checkout --detach "$parent"
          test -z "$(git status --porcelain)"
      - name: Verify exact reviewed transformations and create candidate branch only
        shell: bash
        run: python3 "$RUNNER_TEMP/graph-topology-once.py"
      - uses: actions/upload-artifact@v4
        with:
          name: graph-topology-candidate
          path: ${{ runner.temp }}/graph-candidate/
          retention-days: 1
          if-no-files-found: error
