name = "mathia"
version = "0.1.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"

[[lean_lib]]
name = "MathiaPrimeCircleFormalization"
srcDir = "research/prime_circle/formalization"
roots = ["PC063AnchorHaar"]

[[lean_lib]]
name = "MathiaPrimeFluteFormalization"
srcDir = "research/prime_flute/formalization"
