  "WI088PartialBijection", "WI088PrimePartialMap", "WI088ResidualPrimeRank",
  "WI102CollapsedRotation", "WI137OperatorDistance", "WI168FlagRankBudget",
  "WI175LinearPressureCancellation"]

[[lean_lib]]
name = "MathiaWeilPositivityFormalization"
srcDir = "research/weil_positivity/formalization"
roots = ["WP014SchifferIndefinite"]

[[lean_lib]]
name = "MathiaArithmeticFidelityFormalization"
srcDir = "research/arithmetic_fidelity/formalization"
roots = ["AF134WitnessSaturation", "AF153TransportedResetCovariance", "AF216SignVariation"]

[[lean_lib]]
name = "MathiaAnalyticFrontierFormalization"
srcDir = "research/analytic_frontier/formalization"
roots = ["ANF087ZeroSetPacking"]

[[lean_lib]]
name = "MathiaXiFlowFormalization"
srcDir = "research/xi_flow/formalization"
roots = ["XF129HeatObservability"]
