name = "mathia"
version = "0.1.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"

[[lean_lib]]
name = "MathiaPrimeCircleFormalization"
srcDir = "research/prime_circle/formalization"
roots = ["PC063AnchorHaar"]

[[lean_lib]]
name = "MathiaPrimeFluteFormalization"
srcDir = "research/prime_flute/formalization"
roots = ["PF091WeightedPathMemory"]

[[lean_lib]]
name = "MathiaWeilInertiaFormalization"
srcDir = "research/weil_inertia/formalization"
roots = ["WI011TraceEnergy", "WI011FourPointAssembly", "WI081PairwiseRamanujanRank",
  "WI088PartialBijection", "WI088PrimePartialMap", "WI088ResidualPrimeRank",
  "WI102CollapsedRotation", "WI137OperatorDistance", "WI168FlagRankBudget"]

[[lean_lib]]
name = "MathiaWeilPositivityFormalization"
srcDir = "research/weil_positivity/formalization"
roots = ["WP014SchifferIndefinite"]

[[lean_lib]]
name = "MathiaArithmeticFidelityFormalization"
srcDir = "research/arithmetic_fidelity/formalization"
roots = ["AF134WitnessSaturation"]
